services:
    postgres:
        image: postgres:18.6-bookworm
        container_name: spk-skrining-anak-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: spk_skrining_anak
            POSTGRES_USER: spk_user
            POSTGRES_PASSWORD: spk_dev_password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U spk_user -d spk_skrining_anak"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: spk-skrining-anak-app
        restart: unless-stopped
        working_dir: /app
        user: "${UID:-1000}:${GID:-1000}"
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
    postgres_data: